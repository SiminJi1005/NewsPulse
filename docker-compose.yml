services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: newspulse
      POSTGRES_PASSWORD: newspulse
      POSTGRES_DB: newspulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"

  dedup-consumer:
    build: ./services/consumer-python
    command: python -u -m app.dedup
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379
      PYTHONUNBUFFERED: "1"
    depends_on:
      - kafka
      - redis

  pg-writer:
    build: ./services/consumer-python
    command: python -u -m app.pg_writer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DB_URL: postgresql+psycopg2://newspulse:newspulse@postgres:5432/newspulse
      PYTHONUNBUFFERED: "1"
    depends_on:
      - kafka
      - postgres

  es-writer:
    build: ./services/consumer-python
    command: python -u -m app.es_writer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      ES_URL: http://elasticsearch:9200
      PYTHONUNBUFFERED: "1"
    depends_on:
      - kafka
      - elasticsearch

volumes:
  pgdata:
  esdata: